<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>[My Todo List Gweh]</h1>
        <button id="theme-toggle" class="btn-theme">Beralih ke Light Mode</button>
    </header>

    <div class="layout-wrapper">

        <main class="task-board">
            <h2>Active List</h2>

            <div id="task-container"></div>
        </main>

        <aside class="control-panel">
            <section class="add-task">
                <h2>Deploy New Task</h2>
                <form id="task-form">
                    <div class="input-group">
                        <label>Task Name</label>
                        <input type="text" id="task-name" placeholder="Nama tugas..." required>
                    </div>
                    <div class="input-group split">
                        <div>
                            <label>Start Date</label>
                            <input type="date" id="start-date" required>
                        </div>
                        <div>
                            <label>Deadline</label>
                            <input type="date" id="deadline" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="task-desc" placeholder="Detail operasional..." rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-execute">Add Task</button>
                </form>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 IF Pemrograman Web - Muhammad Hanif Musyafa (5025251093)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
